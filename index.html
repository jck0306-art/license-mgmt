<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>자격증 시험 관리 (PassTrack)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">
  <div class="flex h-screen overflow-hidden">
    
    <!-- 좌측 사이드바 -->
    <aside class="w-80 bg-slate-800 border-r border-slate-700 flex flex-col justify-between">
      <div class="p-4">
        <div class="flex items-center justify-between mb-4">
          <h1 class="text-xl font-bold text-indigo-400 flex items-center gap-2">
            <i class="fa-solid fa-shield-halved"></i> PassTrack
          </h1>
        </div>
        
        <div id="sync-status" class="text-xs text-slate-400 bg-slate-900/60 p-2 rounded mb-4 flex items-center gap-2 border border-slate-700">
          <i class="fa-solid fa-arrows-rotate animate-spin text-indigo-400"></i> 연결 중...
        </div>

        <!-- 🏆 취득 자격증 보관함 바로가기 버튼 -->
        <button id="achieved-menu-btn" onclick="window.openAchievedView()" class="w-full text-left p-2.5 rounded-lg flex items-center justify-between text-sm transition text-slate-300 hover:bg-slate-700/50 mb-3 border border-slate-700/80">
          <div class="flex items-center gap-2">
            <i class="fa-solid fa-award text-amber-400 text-sm"></i>
            <span class="font-bold">취득 자격증 보관함</span>
          </div>
          <span id="achieved-count-badge" class="text-xs px-2 py-0.5 rounded-full bg-slate-900 border border-slate-700 text-amber-300 font-mono font-bold">0</span>
        </button>

        <div class="flex justify-between items-center mb-3">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">목표 자격증 / 과목</span>
          <button onclick="window.openAddModal()" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-2 py-1 rounded transition">
            + 자격증 추가
          </button>
        </div>
        
        <ul id="cert-list" class="space-y-2 overflow-y-auto max-h-[calc(100vh-320px)] pr-1"></ul>
      </div>

      <!-- 선택된 자격증 전용 구글 시트 뷰 버튼 -->
      <div class="p-4 border-t border-slate-700">
        <button onclick="window.openGoogleSheetView()" class="w-full text-xs text-emerald-300 hover:text-white py-2.5 rounded-lg bg-emerald-500/10 hover:bg-emerald-600 border border-emerald-500/30 transition flex items-center justify-center gap-2 font-semibold">
          <i class="fa-solid fa-table-cells text-sm"></i> <span id="sheet-btn-label">내 구글 시트 열기</span>
        </button>
      </div>
    </aside>

    <!-- 메인 컨텐츠 영역 -->
    <main class="flex-1 overflow-y-auto p-8 bg-slate-900">
      <div id="main-content" class="max-w-4xl mx-auto h-full">
        <div class="text-center py-20 text-slate-500">데이터를 불러오는 중입니다...</div>
      </div>
    </main>
  </div>

  <!-- 🏆 취득 자격증 등록/수정 모달 -->
  <div id="achieved-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-800 rounded-xl max-w-md w-full p-6 border border-slate-700 shadow-2xl">
      <h3 id="achieved-modal-title" class="text-lg font-bold text-white mb-4">취득 자격증 등록</h3>
      <input type="hidden" id="achieved-edit-id" />
      <div class="space-y-4">
        <div>
          <label class="text-xs text-slate-400 block mb-1">자격증 명칭 *</label>
          <input id="achieved-name" type="text" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-amber-400" placeholder="예: 정보보안기사, CPPG" />
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">취득 일자</label>
          <input id="achieved-date" type="date" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-amber-400" />
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">발급기관 / 주관사</label>
          <input id="achieved-issuer" type="text" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-amber-400" placeholder="예: 한국인터넷진흥원, KISIA" />
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">자격증 등록/합격 번호</label>
          <input id="achieved-no" type="text" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-amber-400" placeholder="예: 제2024-XXXX호" />
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">메모 / 비고</label>
          <input id="achieved-memo" type="text" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-amber-400" placeholder="보수교육 주기, 갱신일정 등" />
        </div>
      </div>
      <div class="flex justify-end gap-2 mt-6">
        <button onclick="window.closeAchievedModal()" class="px-4 py-2 text-sm bg-slate-700 rounded text-slate-300">취소</button>
        <button onclick="window.saveAchievedCert()" class="px-4 py-2 text-sm bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded">저장하기</button>
      </div>
    </div>
  </div>

  <!-- 목표 자격증 추가 모달 -->
  <div id="modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-800 rounded-xl max-w-md w-full p-6 border border-slate-700 shadow-2xl">
      <h3 class="text-lg font-bold text-white mb-4">새 자격증 등록</h3>
      <div class="space-y-4">
        <div>
          <label class="text-xs text-slate-400 block mb-1">자격증 명칭</label>
          <input id="new-name" type="text" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white" placeholder="예: CISA, CISSP" />
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">첫 시험 목표일</label>
          <input id="new-date" type="date" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white" />
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">구글 스프레드시트 공유 URL (선택)</label>
          <input id="new-sheet-url" type="text" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white" placeholder="https://docs.google.com/spreadsheets/d/..." />
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">과목 목록 (쉼표로 구분)</label>
          <textarea id="new-subjects" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white" placeholder="1과목, 2과목, 3과목"></textarea>
        </div>
      </div>
      <div class="flex justify-end gap-2 mt-6">
        <button onclick="window.closeAddModal()" class="px-4 py-2 text-sm bg-slate-700 rounded text-slate-300">취소</button>
        <button onclick="window.saveNewCert()" class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-500 rounded text-white font-semibold">등록하기</button>
      </div>
    </div>
  </div>

  <!-- 🌐 패밀리 사이트 퀵 네비게이터 플로팅 UI -->
  <div class="fixed bottom-6 right-6 z-50">
    <div id="family-site-menu" class="hidden mb-3 w-52 bg-slate-900/95 backdrop-blur-md border border-slate-700/80 rounded-2xl shadow-2xl p-2 space-y-1 transition-all">
      <div class="px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-slate-400 border-b border-slate-800/80 mb-1">
        Family Sites
      </div>
      
      <!-- 포털 메인 -->
      <a href="https://jck0306-art.github.io/" class="flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-800/80 transition group">
        <div class="w-6 h-6 rounded-lg bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-center text-indigo-400 group-hover:bg-indigo-600 group-hover:text-white transition">
          <i class="fa-solid fa-house text-[10px]"></i>
        </div>
        <span>포털 허브</span>
      </a>

      <!-- 1. 자격증 트래커 -->
      <a href="https://jck0306-art.github.io/license-mgmt/" class="flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-800/80 transition group">
        <div class="w-6 h-6 rounded-lg bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-center text-indigo-400 group-hover:bg-indigo-600 group-hover:text-white transition">
          <i class="fa-solid fa-graduation-cap text-[10px]"></i>
        </div>
        <span>자격증 관리</span>
      </a>

      <!-- 2. 철분제 & 피검사 (IronTrack) -->
      <a href="https://jck0306-art.github.io/IronTrack/" class="flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-800/80 transition group">
        <div class="w-6 h-6 rounded-lg bg-rose-500/10 border border-rose-500/30 flex items-center justify-center text-rose-400 group-hover:bg-rose-600 group-hover:text-white transition">
          <i class="fa-solid fa-droplet text-[10px]"></i>
        </div>
        <span>철분 관리 (IronTrack)</span>
      </a>

      <!-- 3. 덕질 아카이브 -->
      <a href="https://jck0306-art.github.io/virtual/" class="flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-800/80 transition group">
        <div class="w-6 h-6 rounded-lg bg-pink-500/10 border border-pink-500/30 flex items-center justify-center text-pink-400 group-hover:bg-pink-600 group-hover:text-white transition">
          <i class="fa-solid fa-compact-disc text-[10px]"></i>
        </div>
        <span>덕질 아카이브</span>
      </a>
    </div>

    <!-- 플로팅 토글 버튼 -->
    <button id="family-site-btn" onclick="toggleFamilySiteMenu()" class="w-12 h-12 rounded-2xl bg-slate-800/90 hover:bg-slate-700 text-slate-200 border border-slate-700/80 shadow-2xl flex items-center justify-center text-lg transition duration-200 hover:scale-105 active:scale-95 ml-auto">
      <i id="family-site-icon" class="fa-solid fa-layer-group text-indigo-400"></i>
    </button>
  </div>

  <script type="module" src="js/app.js"></script>

  <script>
    function toggleFamilySiteMenu() {
      const menu = document.getElementById('family-site-menu');
      const icon = document.getElementById('family-site-icon');
      
      if (menu.classList.contains('hidden')) {
        menu.classList.remove('hidden');
        icon.className = "fa-solid fa-xmark text-slate-400 text-base";
      } else {
        menu.classList.add('hidden');
        icon.className = "fa-solid fa-layer-group text-indigo-400";
      }
    }

    document.addEventListener('click', function(e) {
      const container = document.getElementById('family-site-menu')?.parentElement;
      const menu = document.getElementById('family-site-menu');
      const icon = document.getElementById('family-site-icon');
      if (container && !container.contains(e.target) && menu && !menu.classList.contains('hidden')) {
        menu.classList.add('hidden');
        if (icon) icon.className = "fa-solid fa-layer-group text-indigo-400";
      }
    });
  </script>
</body>
</html>
